project: notifs 代码包导出
stage: bundle-export

constraints:
  - id: C1
    text: 范围是把提交 HEAD 的被跟踪文本文件按依赖顺序导出为单个纯文本文件。不做源码修改、不加测试、不改接口，不把未跟踪的构建产物、锁文件、生成稿与历史机器日志写入产物。
  - id: C2
    text: 产物为仓库内可复用的导出脚本 tools/export-codebase.mjs，以及仓库外的 /home/c6h4o2/exports/notifs-codebase-<提交>-<日期>.txt。
  - id: C3
    text: 验收标准是往返还原：从产物逆解析出的每个文件与 git show 的字节完全相等；产物路径集合等于被跟踪文件减去排除清单；正文行数与头部声明一致；产物与工作区均无凭据。
  - id: C4
    text: 允许 git ls-files、git show、git rev-parse、node、wc、sha256sum、secrets-audit.sh、git 本地提交、timeout。
  - id: C5
    text: 不 push、不 reset --hard、不改写历史、不使用 pkill -f 或 killall、不回显凭据、不删除任何被跟踪文件、不改动用户正在运行的服务。
  - id: C6
    text: 预算 30 分钟；导出脚本单次运行不超过 10 秒；产物不超过 400 KB；不产生长期运行进程。

scope:
  in:
    - 按依赖方向排列全部被跟踪源码、配置、测试、文档
    - 头部给出提交、文件数、行数、排除清单与行号索引
    - 往返还原校验与密钥扫描
  out:
    - 源码与接口变更
    - 锁文件、构建产物、生成稿、历史机器日志
    - 提交产物到仓库

artifacts:
  - id: A1
    path: tools/export-codebase.mjs
    form: 可复用的导出与自校验脚本
  - id: A2
    path: /home/c6h4o2/exports/notifs-codebase-*.txt
    form: 单文件代码包

acceptance:
  entry: bash /tmp/opencode/notifs-bundle-accept.sh
  checks:
    - id: K1
      from: C1
      check: 产物只含被跟踪文本文件，无构建产物与锁文件
    - id: K2
      from: C2
      check: A1 与 A2 存在，A2 头部提交号等于 HEAD
    - id: K3
      from: C3
      check: 往返还原逐文件字节相等，路径集合与正文行数一致，无密钥命中
    - id: K4
      from: C4
      check: 仅使用允许命令
    - id: K5
      from: C5
      check: 工作区干净，未被跟踪文件未被删除，未 push
    - id: K6
      from: C6
      check: 记录运行耗时与产物体积

allowed_commands:
  - git ls-files / git show / git rev-parse / git status / git add / git commit
  - node
  - wc / sha256sum
  - ~/.config/opencode/scripts/secrets-audit.sh
  - timeout

forbidden:
  - git push、reset --hard、改写历史
  - pkill -f、killall
  - 回显凭据
  - 删除被跟踪文件
  - 操作正在运行的服务

budget:
  time: 30 分钟
  cost: 无模型调用

project: notifs 0.2 真实 agent 闭环
stage: real-agent-loop

constraints:
  - id: C1
    text: 范围只覆盖 OpenCode 宿主侧回复桥、构建入口、测试与文档，以及用同一个飞书 bot 完成一次真实的人到 agent 再到人的闭环；不改消息模型、订阅模型、权限模型和既有 adapter 语义。
  - id: C2
    text: 产物为 apps/opencode-host 的回复桥、tests/opencode-host.test.ts、tools/build.mjs 与 package.json 的构建入口、docs/configuration.md 的宿主说明、docs/validation/stage-6.md 的验证记录。
  - id: C3
    text: 入口为 pnpm typecheck、pnpm test、pnpm build，以及真实飞书闭环：人在飞书发送消息，同一个 bot 的长连接入站，notifs 0.2 推送到真实 OpenCode 会话，宿主桥把模型回复以 agent 身份发回 notifs，再由同一个 bot 出站到同一会话。
  - id: C4
    text: 只允许 pnpm、node、tsx、curl、git、timeout、ssh；真实闭环期间允许临时停用 relay 上的 feishu-events 入站 producer，允许发送本次测试所需的真实飞书消息。
  - id: C5
    text: 不 push、不修改全局 OpenCode 配置、不回显凭据、不删除旧 notifs 数据、不使用 pkill/killall、不更换飞书应用、不在测试结束后保留临时凭据文件。
  - id: C6
    text: 预算 4 小时；真实模型调用最多 3 次；闭环失败立即恢复旧 producer 并记录完整失败输出。

scope:
  in:
    - OpenCode 宿主侧捕获已完成 assistant 回复并发布 agent reply
    - 本地 notifs 0.2 与 Feishu bridge 的同 bot 双向验证
    - 真实模型 opencode-go/deepseek-v4.1-flash 的闭环调用
  out:
    - 修改消息/订阅/权限契约
    - 修改全局 OpenCode 配置
    - 永久切换生产 notifs
    - Discord/Windows 桌面

artifacts:
  - id: A1
    path: apps/opencode-host/src/main.ts
    form: OpenCode 回复桥，轮询会话并发布 reply
  - id: A2
    path: tests/opencode-host.test.ts
    form: 回复提取、去重、发布与错误处理回归
  - id: A3
    path: tools/build.mjs + package.json
    form: opencode-host 构建入口与 bin
  - id: A4
    path: docs/configuration.md
    form: OpenCode 宿主回复桥配置说明
  - id: A5
    path: docs/validation/stage-6.md
    form: 真实验证命令、输出与结论

acceptance:
  entry: pnpm typecheck && pnpm test && pnpm build
  checks:
    - id: K1
      from: C1
      check: 消息/订阅/权限模型与既有 adapter 语义未改
    - id: K2
      from: C2
      check: A1–A5 存在
    - id: K3
      from: C3
      check: 构建通过且真实飞书闭环有消息 ID、投递状态与模型回复证据
    - id: K4
      from: C4
      check: 仅使用允许命令，测试后旧 producer 已恢复
    - id: K5
      from: C5
      check: 工作区无凭据，无全局配置改动，未 push
    - id: K6
      from: C6
      check: 记录耗时、模型调用次数与失败输出

allowed_commands:
  - pnpm install / pnpm run
  - node / npx tsx
  - curl
  - git status / git log / git diff
  - ssh
  - timeout

forbidden:
  - git push、改写远端、删除分支
  - 修改全局 OpenCode 配置
  - 回显凭据
  - 删除旧 notifs 数据
  - pkill -f、killall

budget:
  time: 4 小时
  cost: 真实模型调用最多 3 次

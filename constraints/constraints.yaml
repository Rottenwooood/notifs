project: notifs v0.2.0 代码冗余清理
stage: code-cleanup

constraints:
  - id: C1
    text: 范围是删除零引用导出与重复实现：adapters 的 adapterKinds、飞书两个 adapter 各自复制的截断助手。不保留 registerAdapter，因为它已被 tests/delivery-retry.test.ts 使用；不改投递、渲染与重试语义。
  - id: C2
    text: 产物为 packages/adapters/src/{index,render,feishu,feishu-app}.ts 的修改，以及本阶段约束清单与其生成稿。
  - id: C3
    text: 验收标准是 pnpm typecheck、pnpm test、pnpm build 通过，隔离数据目录与端口下 CLI 能 init/start 并通过 /health，适配器注册表八种 kind 仍可解析。
  - id: C4
    text: 允许 pnpm、node、curl、git 本地提交、timeout，以及 ~/.config/opencode/scripts 下的脚本；测试使用隔离目录与端口。
  - id: C5
    text: 不 push、不 reset --hard、不改写历史、不删除用户正在编辑的 README.md、不使用 pkill -f 或 killall、不改全局 OpenCode 配置。
  - id: C6
    text: 预算 40 分钟；不新增依赖；改动不超过 6 个文件。

scope:
  in:
    - 删除零引用导出 adapterKinds
    - 把飞书截断助手收敛到 render.ts
  out:
    - 投递、渲染与重试语义变更
    - 新增适配器或扩展点
    - 用户 README 改动的提交

artifacts:
  - id: A1
    path: packages/adapters/src/index.ts
    form: 删除零引用导出
  - id: A2
    path: packages/adapters/src/{render,feishu,feishu-app}.ts
    form: 共享截断助手

acceptance:
  entry: bash /tmp/opencode/notifs-cleanup-accept.sh
  checks:
    - id: K1
      from: C1
      check: adapterKinds 不存在；registerAdapter 保留并被测试使用
    - id: K2
      from: C2
      check: 四个源文件存在且无本地截断副本
    - id: K3
      from: C3
      check: typecheck/test/build 通过，健康检查返回 ok
    - id: K4
      from: C4
      check: 仅在隔离目录与端口操作
    - id: K5
      from: C5
      check: 工作区只含本次改动与用户 README 改动，未 push
    - id: K6
      from: C6
      check: 记录改动文件数与耗时

allowed_commands:
  - pnpm install / pnpm run
  - node
  - curl
  - git status / git diff / git add / git commit
  - timeout

forbidden:
  - git push、reset --hard、改写历史
  - 回显凭据
  - pkill -f、killall
  - 删除用户正在编辑的 README.md
  - 操作生产服务

budget:
  time: 40 分钟
  cost: 无模型调用

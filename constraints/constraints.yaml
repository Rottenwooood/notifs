project: notifs 0.2 adapter 边界与入站链路
stage: adapter-boundary

constraints:
  - id: C1
    text: 范围只覆盖统一 adapter 契约、adapter 侧渲染与限频合流语义、OpenCode synthetic 注入、飞书人类入站 adapter；不改消息模型、订阅模型与权限模型。
  - id: C2
    text: 产物为 contracts 的统一 adapter 接口、adapters 的统一 deliver 与 batch 渲染、OpenCode synthetic 调用、apps/feishu-inbound、构建入口、测试与文档。
  - id: C3
    text: 入口为 pnpm typecheck、pnpm test、pnpm build、真实 OpenCode synthetic 注入验证、伪造飞书事件到中心再到订阅目标的端到端验证。
  - id: C4
    text: 只允许 pnpm、node、tsx、curl、git、timeout；不修改用户正在使用的服务与全局 OpenCode 配置；不发送真实飞书消息。
  - id: C5
    text: 不 push、不保留旧接口、不回显凭据、不删除旧用户数据、不使用 pkill/killall。
  - id: C6
    text: 预算 4 小时；真实 OpenCode 验证最多 1 次模型调用；失败即停并记录输出。

scope:
  in:
    - 所有 adapter 统一为 receive batch、返回 SendResult
    - 人类渠道 adapter 自己从 content 渲染，一个限频窗口合并为一条消息
    - OpenCode adapter 使用 synthetic message，delivery=steer，metadata 与 trust 标记
    - 飞书入站 adapter 作为独立 bridge，用身份 token 发布 human.message
  out:
    - 修改 type/content 契约
    - 修改订阅与身份权限
    - Discord/Windows 桌面实现
    - 旧架构兼容

artifacts:
  - id: A1
    path: packages/contracts/src/index.ts
    form: DeliveryAdapter 与 DeliveryContext
  - id: A2
    path: packages/adapters/src/*.ts
    form: 统一 deliver、batch 渲染、OpenCode synthetic、飞书入站
  - id: A3
    path: apps/feishu-inbound/src/main.ts
    form: 独立飞书事件 bridge
  - id: A4
    path: tools/build.mjs + package.json
    form: feishu-inbound 构建与 bin
  - id: A5
    path: tests/*.test.ts
    form: adapter 契约、渲染、OpenCode synthetic、飞书入站、限频合流回归
  - id: A6
    path: docs/configuration.md + README.md
    form: adapter 边界、入站、OpenCode 语义与新入口

acceptance:
  entry: pnpm typecheck && pnpm test && pnpm build
  checks:
    - id: K1
      from: C1
      check: 消息/订阅/权限模型未改
    - id: K2
      from: C2
      check: A1–A6 存在
    - id: K3
      from: C3
      check: 测试、构建、真实 OpenCode synthetic、飞书入站闭环通过
    - id: K4
      from: C4
      check: 未修改用户服务/全局配置，未发真实飞书消息
    - id: K5
      from: C5
      check: 工作区无凭据，无旧入口，未 push
    - id: K6
      from: C6
      check: 记录耗时与失败输出

allowed_commands:
  - pnpm install / pnpm run
  - node / npx tsx
  - curl
  - git status / git log / git diff
  - timeout

forbidden:
  - git push、改写远端、删除分支
  - 修改用户正在使用的 notifs 服务或全局 OpenCode 配置
  - 真实飞书消息、真实凭据回显
  - pkill -f、killall

budget:
  time: 4 小时
  cost: 真实 OpenCode 验证最多 1 次模型调用
